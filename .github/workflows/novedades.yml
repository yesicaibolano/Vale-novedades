name: Revisar novedades para Vale

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node revisar-novedades.mjs
      - name: Guardar cambios
        run: |
          git config user.name "Vale Bot"
          git config user.email "vale-bot@users.noreply.github.com"
          git add novedades.json snapshots/
          git diff --quiet --cached || git commit -m "Actualizar novedades"
          git push
